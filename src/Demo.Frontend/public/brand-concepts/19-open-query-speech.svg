<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 112" role="img" aria-labelledby="title desc">
  <title id="title">Open Query speech wordmark</title>
  <desc id="desc">An open speech bubble combines an O with a Q tail to express asking and exploring.</desc>
  <defs>
    <linearGradient id="speech" x1="12" y1="15" x2="99" y2="99" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5D6CFF"/>
      <stop offset="1" stop-color="#34C9B0"/>
    </linearGradient>
  </defs>
  <path d="M76 78H46c-18 0-32-13-32-30s14-30 32-30h32c18 0 32 13 32 30 0 10-5 19-13 25l12 16-20-10c-4 0-8-1-13-1Z" fill="none" stroke="url(#speech)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M69 43a10 10 0 1 1-3 19l11 10" fill="none" stroke="#17233D" stroke-width="7" stroke-linecap="round"/>
  <text x="132" y="68" fill="#17233D" font-family="Inter,Segoe UI,sans-serif" font-size="44" font-weight="700" letter-spacing="-1">Open <tspan fill="#536CE6">Query</tspan></text>
</svg>
