    </linearGradient>
  </defs>
  <path d="M88 51a35 35 0 1 1-10-25" fill="none" stroke="url(#window)" stroke-width="11" stroke-linecap="round"/>
  <path d="M82 75 98 91" fill="none" stroke="#17233D" stroke-width="11" stroke-linecap="round"/>
  <rect x="39" y="36" width="28" height="28" rx="8" fill="none" stroke="#17233D" stroke-width="7"/>
  <circle cx="53" cy="50" r="5" fill="#17233D"/>
  <text x="118" y="67" fill="#17233D" font-family="Inter,Segoe UI,sans-serif" font-size="48" font-weight="700" letter-spacing="-2">o<tspan fill="#34AFA0">Query</tspan></text>
