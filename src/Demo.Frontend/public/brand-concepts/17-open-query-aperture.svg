<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 112" role="img" aria-labelledby="title desc">
  <title id="title">Open Query aperture wordmark</title>
  <desc id="desc">An open circular aperture forms both O and Q through a shared cut and tail.</desc>
  <defs>
    <linearGradient id="aperture" x1="15" y1="18" x2="98" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB45C"/>
      <stop offset=".52" stop-color="#F06D8F"/>
      <stop offset="1" stop-color="#735FFF"/>
    </linearGradient>
  </defs>
  <path d="M82 34a35 35 0 1 0 0 44" fill="none" stroke="url(#aperture)" stroke-width="12" stroke-linecap="round"/>
  <path d="M82 34a35 35 0 0 1 4 44L103 94" fill="none" stroke="#17233D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 56h30" stroke="#17233D" stroke-width="6" stroke-linecap="round"/>
  <text x="132" y="68" fill="#17233D" font-family="Inter,Segoe UI,sans-serif" font-size="44" font-weight="700" letter-spacing="-1">Open <tspan fill="#E8758C">Query</tspan></text>
</svg>
